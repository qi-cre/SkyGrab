[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "skygrab"
version = "0.1.0"
description = "Aggressive multi-source satellite data harvester with a modern TUI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kase" }]
keywords = ["satellite", "noaa", "eumetsat", "sdr", "goes", "tui", "downloader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: TUI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "textual>=0.58",
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.optional-dependencies]
ground = ["boto3>=1.34"]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "mypy>=1.10"]

[project.scripts]
skygrab = "skygrab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skygrab"]
